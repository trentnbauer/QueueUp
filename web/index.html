<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QueueUp — pick a game, together. Track your backlog, vote as a group, and spin the wheel when nobody can decide." />
    <meta name="theme-color" content="#16130f" />
    <!-- Relative, not root-absolute (issue #438): Vite never rewrites public-dir HTML references
         regardless of `base`, and these need to resolve against the runtime <base href> the
         server injects (server/src/plugins/static.ts) for sub-path hosting to work. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>QueueUp</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
