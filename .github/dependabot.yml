# Weekly update checks. See
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Minor and patch updates come as one grouped PR per ecosystem so there is not a PR per package. Major
# versions are left as their own PRs: they need a real `docker build` and the boot check (see the
# docker-boot workflow) before merging, not only the unit tests.
#
# The postgres and redis images pinned in the compose files are covered by the docker-compose entry. The
# ollama image is unpinned (`:latest`), so there is nothing for Dependabot to bump.
version: 2
updates:
  # One lock file for the root, server, web and shared workspaces.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Stays on the Node major the container runs (node:24); a newer @types/node would describe APIs the
      # runtime does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Prisma 7 is a migration, not a bump (see issue #1040).
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]

  # The node:24-alpine base image in docker/Dockerfile.server.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    ignore:
      # Node is moved deliberately, to an LTS major.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # postgres:<major>-alpine and redis:<major>-alpine in the compose files. These tags only move on a new
  # major, so every PR here is a major bump. Do not merge a postgres one as-is: existing data directories
  # are not compatible across majors and need a dump/restore (or pg_upgrade) first.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
