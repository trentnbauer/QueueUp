name: Sync wiki

# The GitHub wiki is its own git repository (QueueUp.wiki.git), so it can't be changed through a
# normal pull request. docs/wiki/ in this repo is the source of truth instead: edit the pages there
# in a PR, and once it merges this workflow copies the folder to the wiki and pushes it.
# Anything edited directly in the wiki's web editor is overwritten on the next sync.
on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
  workflow_dispatch:

permissions:
  contents: write # pushing to the wiki repository uses the repo's own GITHUB_TOKEN

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push docs/wiki to the wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.wiki.git" wiki
          # --delete makes the wiki an exact copy of docs/wiki (a page removed here is removed there);
          # the wiki's own .git directory is left alone.
          rsync -a --delete --exclude '.git' docs/wiki/ wiki/
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already matches docs/wiki - nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync from ${REPO}@${SHA::7} (docs/wiki)"
          git push origin HEAD
