name: squadqueue

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-squadqueue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-squadqueue}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-squadqueue}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/trentnbauer/queueup:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      #### PLEASE REFER TO NOTES ON THE EXAMPLE ENV ####
      ## Front End Config
      APP_BASE_URL: ${APP_BASE_URL}
      BASE_PATH: ${BASE_PATH}                                  # Optional - hosts the app under a sub-path, e.g. /queueup
      SESSION_SECRET: ${SESSION_SECRET}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      ## User Authentication Methods
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      STEAM_API_KEY: ${STEAM_API_KEY}
      ## Importing Data
      GGDEALS_API_KEY: ${GGDEALS_API_KEY}                      # Required for game price lookup
      GGDEALS_DEFAULT_REGION: ${GGDEALS_DEFAULT_REGION:-us}    # Default Pricing
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}                        # Required for game search to work
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}                # Required for game search to work
      SCANDEX_API_KEY: ${SCANDEX_API_KEY}                      # For barcode scanning for importing physical games
      # Backend Config
      DEV_FAKE_AUTH: ${DEV_FAKE_AUTH:-false}                   # Testing - enables automatic login with admin account for everyone accesing QueueUp
      ADMIN_EMAILS: ${ADMIN_EMAILS}                            # QueueUp Administrators
      DATABASE_URL: postgresql://${POSTGRES_USER:-squadqueue}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-squadqueue}
      REDIS_URL: redis://redis:6379
      PORT: 3000 ## Leave this
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      # node:22-alpine has no curl/wget - Node's built-in fetch avoids adding a package just for this.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres:
  redis:
