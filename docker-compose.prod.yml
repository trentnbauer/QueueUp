name: squadqueue

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-squadqueue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-squadqueue}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-squadqueue}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/trentnbauer/queueup:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      #### PLEASE REFER TO NOTES ON THE EXAMPLE ENV ####
      ## Front End Config
      APP_BASE_URL: ${APP_BASE_URL}
      BASE_PATH: ${BASE_PATH}                                  # Optional - hosts the app under a sub-path, e.g. /queueup
      SESSION_SECRET: ${SESSION_SECRET}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      PRIVATE_INSTANCE: ${PRIVATE_INSTANCE:-false}          # Optional - true makes every user everyone's friend
      LOG_LEVEL: ${LOG_LEVEL:-info}                            # Optional - fatal/error/warn/info/debug/trace/silent
      LOG_REQUESTS: ${LOG_REQUESTS:-false}                     # Optional - true logs every HTTP request (debugging)
      ## User Authentication Methods
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      STEAM_API_KEY: ${STEAM_API_KEY}
      PLAYTIME_TRACKING_ENABLED: ${PLAYTIME_TRACKING_ENABLED:-false}  # Optional - Steam playtime nudges (needs STEAM_API_KEY)
      ## Importing Data
      GGDEALS_API_KEY: ${GGDEALS_API_KEY}                      # Required for game price lookup
      GGDEALS_DEFAULT_REGION: ${GGDEALS_DEFAULT_REGION:-us}    # Default Pricing
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}                        # Required for game search to work
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}                # Required for game search to work
      SCANDEX_API_KEY: ${SCANDEX_API_KEY}                      # For barcode scanning for importing physical games
      ## Sign-in captcha (Cloudflare Turnstile) - optional, set both to turn it on
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      ## Google Analytics - optional, your GA4 measurement ID (G-XXXXXXXXXX); users opt in from setup/Settings
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID}
      ## Email alerts (SMTP) - optional; host, port and from address turn it on
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      ## Xbox library sync - optional; the client ID of your Microsoft (Azure) app registration. See .env.example
      XBOX_CLIENT_ID: ${XBOX_CLIENT_ID}
      ## Sign in with Xbox - optional; "true" turns it on (needs the redirect URI added to the app). See .env.example
      XBOX_SIGN_IN: ${XBOX_SIGN_IN}
      XBOX_CLIENT_SECRET: ${XBOX_CLIENT_SECRET}
      ## AI backend - optional; a provider and model turn it on for everyone (people can also set their own).
      ## Provider: anthropic, openai, gemini, ollama or openai_compatible. The key is optional for local models.
      AI_PROVIDER: ${AI_PROVIDER}
      AI_MODEL: ${AI_MODEL}
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL}                              # Only for ollama / openai_compatible, or a proxy
      AI_ALLOW_USER_SETTINGS: ${AI_ALLOW_USER_SETTINGS:-true}  # Let people bring their own provider and key
      AI_ALLOW_USER_BASE_URL: ${AI_ALLOW_USER_BASE_URL:-false} # Let their settings name a custom address (trusted instances only)
      ## Cloudflare Tunnel - optional; with a token set, QueueUp runs cloudflared itself (no open port needed)
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
      # Backend Config
      DEV_FAKE_AUTH: ${DEV_FAKE_AUTH:-false}                   # Testing - enables automatic login with admin account for everyone accesing QueueUp
      ADMIN_EMAILS: ${ADMIN_EMAILS}                            # QueueUp Administrators
      ALLOW_DESTRUCTIVE_SCHEMA_PUSH: ${ALLOW_DESTRUCTIVE_SCHEMA_PUSH:-false}  # Leave false; set true only for the one boot after a deliberate destructive schema change
      DATABASE_URL: postgresql://${POSTGRES_USER:-squadqueue}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-squadqueue}
      REDIS_URL: redis://redis:6379
      BACKUP_DIR: /backups                                     # Admin > Backups writes here (nightly by default; schedule is edited in the admin menu)
      PORT: 3000 ## Leave this
    volumes:
      - backups:/backups
    # Not needed if you only reach QueueUp through the built-in Cloudflare Tunnel.
    # Published on this machine only (127.0.0.1) by default: with the port open to the network,
    # anyone could reach it directly and send their own X-Forwarded-For, which TRUST_PROXY trusts,
    # slipping every per-IP rate limit. If your reverse proxy runs on another machine (or reaches
    # this container through the host's LAN address), set BIND_ADDRESS=0.0.0.0 and firewall the
    # port so only that proxy can connect.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    healthcheck:
      # node:22-alpine has no curl/wget - Node's built-in fetch avoids adding a package just for this.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres:
  redis:
  backups:
