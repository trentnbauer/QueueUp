name: queueup

# QueueUp with its own locally hosted AI, ready to run: Postgres, Redis, an Ollama server with a
# small model, and the app already pointed at it as the server-wide AI, so every user can use the
# AI features without bringing a key (Add game > AI picks, duplicate finder, AI import matching...).
#
#   docker compose -f docker-compose.local-ai.yml up -d
#
# Everything the AI needs is already set below. The rest of QueueUp's settings (APP_BASE_URL,
# SESSION_SECRET, sign-in methods, IGDB keys, ...) are read from a .env file next to this one, the
# same names as .env.example. The first start downloads the model (about 2 GB for the default);
# AI features start working once the `ollama-pull` container has finished (`docker compose -f
# docker-compose.local-ai.yml logs -f ollama-pull`).
#
# Change the model with OLLAMA_MODEL in .env (any model from https://ollama.com/library). Small,
# CPU-friendly options: llama3.2:3b (default, ~2 GB), qwen2.5:3b, llama3.2:1b (~1.3 GB, faster, less
# accurate). Expect a few seconds per answer on a CPU-only machine; a GPU is much faster (see the
# commented block on the ollama service). Needs roughly 4 GB of free RAM for the default model.
#
# Notes:
# - The AI address below is set by the operator, so the private-address check on people's own AI
#   addresses does not apply to it.
# - AI_SERVER_DAILY_LIMIT is 0 here (no per-person daily cap) because the model runs on your own
#   hardware. Set it to a number to ration it.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-squadqueue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-squadqueue}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-squadqueue}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    # NVIDIA GPU (needs the NVIDIA Container Toolkit on the host): uncomment to use it.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot: downloads the model into the ollama volume, then exits. Re-running does nothing if it is
  # already there, so it is safe on every `up`.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.2:3b}"]

  app:
    image: ghcr.io/trentnbauer/queueup:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    # Everything else (APP_BASE_URL, SESSION_SECRET, ADMIN_EMAILS, sign-in providers, API keys, ...).
    # Compose 2.24+; the file is optional here but QueueUp will not start without APP_BASE_URL and
    # SESSION_SECRET, so create it from .env.example.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-squadqueue}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-squadqueue}
      REDIS_URL: redis://redis:6379
      BACKUP_DIR: /backups
      PORT: 3000
      ## The server-wide AI: the local Ollama server above, for every user.
      AI_PROVIDER: ollama
      AI_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      AI_BASE_URL: http://ollama:11434/v1
      AI_API_KEY: ""
      AI_SERVER_DAILY_LIMIT: ${AI_SERVER_DAILY_LIMIT:-0}
    volumes:
      - backups:/backups
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  postgres:
  redis:
  ollama:
  backups:
